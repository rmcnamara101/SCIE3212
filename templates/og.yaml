# This is a template for a YAML file that defines a tumour growth model.
# It is used to define the model and its parameters.

simulation:
  name: Original Simulation Structure
  seed: 1081

domain:
  shape: 60 # integer defining the number of grid points in each dimension
  dx: 20 # float defining the spacing of the grid

time:
  steps: 21
  dt: 0.5

populations:
  Healthy:
    label: Healthy Cells
    color: Green
    dynamics:
      lambda: 1.2 # float
      mu: 0.8 # float
      mobility: 0.5 # float
      nutrient_threshold: 0.3 # float
      nutrient_consumption: 0.1 # float
      nutrient_production: 0.07 # float
    transfer: 
        to: Diseased # string matching another population name
        rate: 0.99 # float defining proportion of cells that transfer 

  Diseased:
    label: Diseased Cells
    color: Red
    dynamics:
      lambda: 1.5 # float
      mu: 0.7 # float
      mobility: 0.5 # float
      nutrient_threshold: 0.3 # float
      nutrient_consumption: 0.1 # float
      nutrient_production: 0.07 # float


nutrient:
  - name: General
    label: General nutrient
    color: Orange
    dynamics:
      diffusion: 20 # float

