# This is a template for a YAML file that defines a tumour growth model.
# It is used to define the model and its parameters.

simulation:
  name: Physics Fields Analysis
  seed: 1209

domain:
  shape: 200 # integer defining the number of grid points in each dimension
  dx: 0.1 # float defining the spacing of the grid

time:
  steps: 1
  dt: 0.5

populations:
  Healthy:
    label: Tumour Cells
    color: Green
    dynamics:
      lambda: 1.2 # float
      mu: 0.8 # float
      mobility: 0.5 # float
      nutrient_threshold: 0.3 # float
      nutrient_consumption: 0.1 # float
      nutrient_production: 0.07 # float

  Necrotic:
    label: Necrotic Cells
    color: Black
    dynamics:
      lambda: 0.0 # float
      mu: 0.2 # float
      mobility: 0.0 # float
      nutrient_threshold: 0.0 # float
      nutrient_consumption: 0.0 # float
      nutrient_production: 0.0 # float
      beta_N: 0.1 # float


nutrient:
  name: General
  label: General nutrient
  color: Orange
  dynamics:
    diffusion: 20 # float
    boundary_value: 1.0

physics:
  adhesion_energy:
    m: 1

# Initial conditions configuration
initial_conditions:
  type: gaussian_random_blob # Options: "spherical", "gaussian_random_blob", "multiple_spheres", "uniform", "custom"
  
  center: [100, 100, 100] # Center coordinates (optional, defaults to domain center)
  radius: 50 # Radius of the sphere (optional, defaults to domain_size/4)
  
  deformation_strength: 0.5 # How much to deform (0.0=sphere, 0.5=very deformed, optional, defaults to 0.3)
  
  seeding_densities:
    Tumour Cells: 0.9 # Density for specific population
    Necrotic Cells: 0.1 # Density for specific population
  
  nutrient:
    type: gradient # Options: "uniform", "gradient" (optional, uses default nutrient manager if not specified)
    concentration: 1.0 # For uniform nutrient field (optional, defaults to 1.0)
    concentration_max: 1.0 # For gradient nutrient field (optional, defaults to 1.0)
    concentration_min: 0.0 # For gradient nutrient field (optional, defaults to 0.0)




