# This is the template for the CSC-T-N model

simulation:
  name: T-N Model
  seed: 1345

domain:
  shape: 100 # integer defining the number of grid points in each dimension
  dx: 100 # float defining the spacing of the grid (in μm)

time:
  steps: 100 # integer defining the number of steps to run the simulation for
  dt: 0.05 # Reduced from 0.5 to improve numerical stability

populations:
  Tumour:
    label: Tumour Cells
    color: Green
    dynamics:
      lambda: 20 # float
      mu: 20 # float
      mobility: 10000.0 # float
      nutrient_threshold: 0.4 # float
      nutrient_consumption: 0.4 # float
      nutrient_production: 0.2 # float
    
    
  Necrotic:
    label: Necrotic Cells
    color: Black
    dynamics:
      lambda: 0.0 # float
      mu: 0 # float
      mobility: 0.0 # float
      nutrient_threshold: 0.0 # float
      nutrient_consumption: 0.0 # float
      nutrient_production: 0.0 # float
      beta_N: 0.01 # float

nutrient:
  name: General
  label: General nutrient
  color: Orange
  dynamics:
    diffusion: 20000 # float
    #boundary_value: 1.0 # float defining the value of the nutrient at the boundary
    k: 6.0 # float defining the steepness of the nutrient switch 

physics:
  adhesion_energy:
    m: 10.0  # Reduced from 100.0 to prevent numerical overflow
  disable_pressure: False
  pressure_solver: original_cg  # Options: "original_cg", "improved_cg", "gmres", "multigrid", "pyamg"
  pressure_constant: 1.0 # float defining the pressure scale factor
  
  # Numerical stability settings
  max_magnitude: 1e6  # Maximum magnitude for mass flux to prevent overflow
  
  # Gravity and bowl potential forces for coagulation mode
  gravity_enabled: False  # Enable gravity force (acts in -z direction)
  gravity_strength: 0.1  # Gravity acceleration in physical units (μm/time²)
  
  bowl_potential_enabled: False  # Enable bowl-shaped potential (parabolic well)
  bowl_potential_strength: 0.05  # Spring constant k for parabolic potential V = k*r²
  bowl_center: [50, 50, 50]  # Center coordinates of the bowl (defaults to domain center)

initial_conditions:

  type: gaussian_random_blob
  radius: 6
  center: [50, 50, 50]
  deformation_strength: 0.3 # How much to deform (0.0=sphere, 0.5=very deformed, optional, defaults to 0.3)


  #type: main_spheroid_with_blobs
  #center: [50, 50, 50]
  #main_radius: 8
  #num_blobs: 12
  #blob_radius_range: [2, 5]
  #blob_distance_range: [9, 20]

  #type: organoid_settling
  #center: [48, 48, 48] # Center coordinates (optional, defaults to domain center)
  #core_radius: 4 # Radius of the sphere (optional, defaults to domain_size/4)
  #outer_radius: 10 # Radius of the sphere (optional, defaults to domain_size/4)
  #core_density: 0.8 # Density of the sphere (optional, defaults to 0.7)
  #outer_density: 0.3 # Density of the sphere (optional, defaults to 0.1)

  #type: multiple_spheres
  #type: uniform
  #type: custom
  
  seeding_densities:
    Tumour: 0.7 # Density for specific population
    Necrotic: 0.0 # Density for specific population
  
  nutrient:
    type: natural # Options: "uniform", "gradient" (optional, uses default nutrient manager if not specified)
    concentration: 1.0 # For uniform nutrient field (optional, defaults to 1.0)
    concentration_max: 1.0 # For gradient nutrient field (optional, defaults to 1.0)
    concentration_min: 0.0 # For gradient nutrient field (optional, defaults to 0.0)

integrator:
  type: forward_euler # Options: "rk4", "adaptive_grid", "rk4_adaptive", "forward_euler", "forward_euler_adaptive", "improved_euler"
  padding: 16 # Number of grid points to pad around active regions (default: 5)
  threshold: 1e-9 # Minimum cell density to consider a point active (default: 1e-6)
  min_sub_grid_size: 10 # Minimum size of sub-grid to use adaptive approach (default: 10)
  tolerance: 1e-6 # Error tolerance for adaptive stepping (default: 1e-6 for RK4, 0.1 for Forward Euler)
  min_dt: 1e-8 # Minimum allowed time step (default: 1e-8)
  max_dt: 1e-2 # Maximum allowed time step (default: 1e-2)
  safety_factor: 0.8 # Safety factor for time step adjustment (default: 0.8, Forward Euler only)