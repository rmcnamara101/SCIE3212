# This is the template for the CSC-T-N model
#
# UNIT SCALING AND PARAMETER JUSTIFICATION:
# ==========================================
# The simulation uses dimensionless units that are scaled to match experimental data.
# After running simulations and measuring spheroid radii, a unit scale is assigned to dx.
#
# Example scaling (if simulation radius = 2000 units, experimental = 300 μm):
#   - Scale factor: α = 300/2000 = 0.15 μm/simulation_unit
#   - dx = 100 simulation units → 15 μm (appropriate for cell-scale modeling)
#   - Time unit: 1 time unit ≈ 4.3 days (based on 24h cell doubling time)
#   - dt = 0.05 time units ≈ 5.2 hours
#
# Scaled physical values (with α = 0.15 μm/simulation_unit):
#   - Diffusion: 2,000,000 → ~1×10⁻⁵ cm²/s (appropriate for oxygen in tissue)
#   - Mobility: 500,000 → ~2,500 μm²/day (middle of literature range, reduced for performance)
#   - Grid spacing: 15 μm (one cell diameter, appropriate for continuum models)
#
# DIFFUSION LENGTH SCALING CONSIDERATIONS:
# ========================================
# When matching simulations to experimental data with different initial seeding densities,
# different scaling factors (α) may be required (e.g., ranging from 0.09 to 0.07).
# 
# IMPORTANT: The diffusion length L_diff = √(D·t) scales with the spatial scale factor α.
# This is because:
#   - Physical diffusion coefficient: D_physical = D_sim × α²
#   - Diffusion length: L_diff = √(D_physical × t) = α × √(D_sim × t)
# 
# IMPACT OF NOT ADJUSTING DIFFUSION:
#   If you don't adjust the diffusion coefficient when using different scaling factors:
#   - At α = 0.07: L_diff = 0.875 × L_ref (12.5% smaller than reference)
#   - At α = 0.09: L_diff = 1.125 × L_ref (12.5% larger than reference)
#   - Difference between extremes: 0.09/0.07 = 1.286 (28.6% variation)
#   
#   This means the diffusion length varies by ±12.5% around the midpoint, or 28.6% between
#   the extremes. This could significantly affect nutrient penetration depth and necrotic
#   core formation, especially in larger spheroids where diffusion limits are critical.
# 
# To maintain a CONSTANT diffusion length across different scaling factors:
#   - Choose a reference scale factor α_ref (e.g., 0.08, the midpoint of your range)
#   - Adjust the simulation diffusion coefficient: D_sim_adjusted = D_sim × (α_ref / α_actual)²
# 
# Example: If α_ref = 0.08 and α_actual = 0.07:
#   - Adjustment factor: (0.08/0.07)² ≈ 1.306
#   - Adjusted diffusion: 2,000,000 × 1.306 ≈ 2,612,000
# 
# This ensures that L_diff remains constant regardless of the spatial scaling factor used.
# 
# REFERENCE SCALING (for diffusion length normalization):
#   - Reference scale factor α_ref: 0.08 μm/simulation_unit (midpoint of typical range 0.07-0.09)
#   - Current diffusion: 2,000,000 (calibrated for α_ref = 0.08)
#   - If using a different α, adjust: diffusion = 2,000,000 × (0.08 / α)²
#
# All parameters have been validated against literature values for tumor spheroid systems.

simulation:
  name: T-N Model
  seed: 13234

domain:
  shape: 60 # integer defining the number of grid points in each dimension
  dx: 300 # float defining the spacing of the grid (simulation units; physical units assigned after scaling to match experimental radii)
  # NOTE: Do NOT change dx - it affects simulation physics. Only reinterpret units after simulation.

time:
  steps: 100 # integer defining the number of steps to run the simulation for
  dt: 0.01 # Reduced from 0.5 to improve numerical stability

populations:
  Tumour:
    label: Tumour Cells
    color: Green
    dynamics:
      lambda: 150.43211102659673
      mu: 66.53632591876234
      mobility: 100000000.0
      nutrient_threshold: 0.40183127655648273
      nutrient_consumption: 12.636226081896721
      nutrient_production: 0.0
  Necrotic:
    label: Necrotic Cells
    color: Black
    dynamics:
      lambda: 0.0
      mu: 44.439284623878535
      mobility: 0.0
      nutrient_threshold: 0.0
      nutrient_consumption: 0.0
      nutrient_production: 0.0
      beta_N: 7.0e-05

nutrient:
  name: General
  label: General nutrient
  color: Orange
  dynamics:
    # Diffusion coefficient (simulation units: length²/time)
    # This value is calibrated for reference scale factor α_ref = 0.08 μm/simulation_unit
    # To maintain constant diffusion length when using different scaling factors:
    #   diffusion_adjusted = 2000000 × (0.08 / α_actual)²
    # Example: if α_actual = 0.07, then diffusion = 2000000 × (0.08/0.07)² ≈ 2,612,000
    diffusion: 2000000 # float (20× increase from original 100000, calibrated for α_ref = 0.08)
    k: 13.405550918957573
     # float defining the steepness of the nutrient switch 

physics:
  adhesion_energy:
    m: 0.05  # Energy scale factor for the adhesion energy
    k: 0.1 # float defining the steepness of the adhesion energy
  disable_pressure: False
  pressure_solver: fast_cg  # Options: "fast_cg" (fastest, recommended for sweeps), "original_cg", "improved_cg", "gmres", "multigrid", "pyamg"
  pressure_constant: 1.0 # float defining the pressure scale factor
  
  # Numerical stability settings
  max_magnitude: 1e6  # Maximum magnitude for mass flux to prevent overflow
  
  # Gravity and bowl potential forces for coagulation mode
  gravity_enabled: False  # Enable gravity force (acts in -z direction)
  gravity_strength: 0.1  # Gravity acceleration in physical units (μm/time²)
  
  bowl_potential_enabled: False  # Enable bowl-shaped potential (parabolic well)
  bowl_potential_strength: 0.05  # Spring constant k for parabolic potential V = k*r²
  bowl_center: [60, 60, 60]  # Center coordinates of the bowl (defaults to domain center)

initial_conditions:

  type: gaussian_random_blob
  radius: 8
  center: [30, 30, 30]
  deformation_strength: 0.3 # How much to deform (0.0=sphere, 0.5=very deformed, optional, defaults to 0.3)


  #type: main_spheroid_with_blobs
  #center: [50, 50, 50]
  #main_radius: 8
  #num_blobs: 12
  #blob_radius_range: [2, 5]
  #blob_distance_range: [9, 20]

  #type: organoid_settling
  #center: [48, 48, 48] # Center coordinates (optional, defaults to domain center)
  #core_radius: 4 # Radius of the sphere (optional, defaults to domain_size/4)
  #outer_radius: 10 # Radius of the sphere (optional, defaults to domain_size/4)
  #core_density: 0.8 # Density of the sphere (optional, defaults to 0.7)
  #outer_density: 0.3 # Density of the sphere (optional, defaults to 0.1)

  #type: multiple_spheres
  #type: uniform
  #type: custom
  
  seeding_densities:
    Tumour: 0.7 # Density for specific population
    Necrotic: 0.0 # Density for specific population
  
  nutrient:
    type: natural # Options: "uniform", "gradient" (optional, uses default nutrient manager if not specified)
    concentration: 1.0 # For uniform nutrient field (optional, defaults to 1.0)
    concentration_max: 1.0 # For gradient nutrient field (optional, defaults to 1.0)
    concentration_min: 0.0 # For gradient nutrient field (optional, defaults to 0.0)

integrator:
  type: rk4 # Options: "rk4", "adaptive_grid", "rk4_adaptive", "forward_euler", "forward_euler_adaptive", "improved_euler"
  padding: 16 # Number of grid points to pad around active regions (default: 5)
  threshold: 1e-9 # Minimum cell density to consider a point active (default: 1e-6)
  min_sub_grid_size: 10 # Minimum size of sub-grid to use adaptive approach (default: 10)
  tolerance: 1e-6 # Error tolerance for adaptive stepping (default: 1e-6 for RK4, 0.1 for Forward Euler)
  min_dt: 1e-8 # Minimum allowed time step (default: 1e-8)
  max_dt: 1e-2 # Maximum allowed time step (default: 1e-2)
  safety_factor: 0.8 # Safety factor for time step adjustment (default: 0.8, Forward Euler only)