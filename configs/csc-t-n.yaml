# This is the template for the CSC-T-N model

simulation:
  name: CSC-T-N Model
  seed: 1345

domain:
  shape: 100 # integer defining the number of grid points in each dimension
  dx: 1000 # float defining the spacing of the grid

time:
  steps: 10 # integer defining the number of steps to run the simulation for
  dt: 0.5 # float defining the time step

populations:
  Stem:
    label: Stem Cells
    color: Green
    dynamics:
      lambda: 1 # float - reduced from 10 to prevent excessive expansion
      mu: 0.02 # float - reduced from 2
      mobility: 1 # float
      nutrient_threshold: 0.5 # float
      nutrient_consumption: 0.1 # float
      nutrient_production: 0.05 # float
    transfer: 
      to: Tumour
      rate: 0.45 # float defining proportion of cells that transfer 
  
  Tumour:
    label: Tumour Cells
    color: Green
    dynamics:
      lambda: 1 # float - reduced from 10 to prevent excessive expansion
      mu: 0.02 # float - reduced from 2
      mobility: 1 # float
      nutrient_threshold: 0.5 # float
      nutrient_consumption: 0.1 # float
      nutrient_production: 0.05 # float
    
    
  Necrotic:
    label: Necrotic Cells
    color: Black
    dynamics:
      lambda: 0.0 # float
      mu: 0.5 # float
      mobility: 0.0 # float
      nutrient_threshold: 0.0 # float
      nutrient_consumption: 0.0 # float
      nutrient_production: 0.0 # float
      beta_N: 0.00001 # float

nutrient:
  name: General
  label: General nutrient
  color: Orange
  dynamics:
    diffusion: 700 # float
    boundary_value: 1.0 # float defining the value of the nutrient at the boundary
    k: 0.05 # float defining the steepness of the nutrient switch

physics:
  adhesion_energy:
    m: 10

initial_conditions:
  type: gaussian_random_blob # Options: "spherical", "gaussian_random_blob", "multiple_spheres", "uniform", "custom"
  
  center: [48, 48, 48] # Center coordinates (optional, defaults to domain center)
  radius: 6.5 # Radius of the sphere (optional, defaults to domain_size/4)
  
  deformation_strength: 0.1 # Further reduced for small adhesion energy to prevent leakage
  seeding_noise_scale: 0.05 # Further reduced noise for small adhesion energy
  
  seeding_densities:
    Tumour: 0.7 # Density for specific population
    Stem: 0.3 # Density for specific population
    Necrotic: 0.0 # Density for specific population
  
  nutrient:
    type: natural # Options: "uniform", "gradient" (optional, uses default nutrient manager if not specified)
    concentration: 1.0 # For uniform nutrient field (optional, defaults to 1.0)
    concentration_max: 1.0 # For gradient nutrient field (optional, defaults to 1.0)
    concentration_min: 0.0 # For gradient nutrient field (optional, defaults to 0.0)

integrator:
  type: adaptive_grid
  padding: 10
  threshold: 1e-6
  min_sub_grid_size: 10